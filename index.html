ие «Завоеватель»`,note:`Главное орудие варианта Leman Russ Conqueror.`},{code:`DC / ОО`,english:`Demolisher Cannon`,russian:`Осадное орудие / орудие «Разрушитель»`,note:`Короткоствольное тяжёлое главное орудие.`},{code:`VC / ПТО`,english:`Vanquisher Cannon`,russian:`Противотанковое орудие «Покоритель»`,note:`Главное противотанковое орудие Leman Russ Vanquisher.`},{code:`PC / ПП`,english:`Plasma Cannon`,russian:`Плазменная пушка`,note:`Может обозначать главное или спонсонное плазменное орудие.`},{code:`LC / ЛП`,english:`Lascannon`,russian:`Лазпушка`,note:`Лазерное противотанковое орудие.`},{code:`MG / МБ`,english:`Megabolter / Punisher Gatling Cannon`,russian:`Мегаболтер / орудие «Каратель»`,note:`Скорострельное главное орудие; значение уточняется моделью техники.`},{code:`HB / ТБ`,english:`Heavy Bolter`,russian:`Тяжёлый болтер`,note:`Курсовое, спонсонное или турельное тяжёлое оружие.`},{code:`HS / ТС`,english:`Heavy Stubber`,russian:`Тяжёлый стаббер`,note:`Крупнокалиберный пулемёт, часто на шкворневой установке.`},{code:`ML / МЛ`,english:`Multi-laser`,russian:`Мультилазер`,note:`Скорострельное лазерное оружие; не путать с ракетной установкой RL.`},{code:`MM / ММ`,english:`Multi-melta`,russian:`Мультимелта`,note:`Тяжёлое противотанковое мельта-оружие.`},{code:`FL / ОГ`,english:`Flamer / Heavy Flamer`,russian:`Огнемёт / тяжёлый огнемёт`,note:`Точный тип зависит от носителя.`},{code:`RL / НУРС`,english:`Rocket Launcher`,russian:`Ракетная установка`,note:`В русской локализации модификаций используется «НУРС».`},{code:`HKM / ПТУР`,english:`Hunter-Killer Missile`,russian:`Ракета «Охотник-убийца»`,note:`Одноразовая управляемая противотанковая ракета.`},{code:`Pintle / ЗПУ`,english:`Pintle-mounted weapon`,russian:`Шкворневая / зенитная пулемётная установка`,note:`Дополнительное оружие на верхней установке.`},{code:`ENG / ковш`,english:`Engineer / dozer equipment`,russian:`Инженерная модификация / бульдозерный отвал`,note:`Инженерное оснащение техники.`},{code:`STC / СШК`,en       .research-card > .research-image {

    <script type="module" src="./assets/vendor/model-viewer-4.3.1.min.js"></script>
    <script>
      (() => {
        const ZOOM_THROTTLE_MS = 55;

        function readScale(viewport) {
          const transform = viewport.querySelector(".tree-canvas")?.style.transform || "";
          const match = transform.match(/scale\(([\d.]+)\)/);
          return match ? Number(match[1]) : 1;
        }

        function updateHint() {
          const hint = document.querySelector(
            ".tree-toolbar > div:first-child > span:last-child",
          );
          if (!hint) return;

          const isRussian = hint.textContent.includes("Зажмите");
          const text = isRussian
            ? "Зажмите левую кнопку мыши на пустом месте и двигайте древо · Колесо мыши — масштаб"
            : "Hold the left mouse button on empty space and drag · Mouse wheel to zoom";

          if (hint.textContent !== text) hint.textContent = text;
        }

        function bindWheelZoom(viewport) {
          if (viewport.dataset.wheelZoomBound === "true") return;
          viewport.dataset.wheelZoomBound = "true";

          let lastZoomAt = 0;
          viewport.addEventListener(
            "wheel",
            (event) => {
              if (event.ctrlKey || event.metaKey || event.deltaY === 0) return;
              event.preventDefault();

              const now = Date.now();
              if (now - lastZoomAt < ZOOM_THROTTLE_MS) return;
              lastZoomAt = now;

              const controls = document.querySelector(".zoom-controls");
              const buttons = controls?.querySelectorAll("button");
              const zoomButton = event.deltaY < 0 ? buttons?.[1] : buttons?.[0];
              if (!zoomButton) return;

              const oldScale = readScale(viewport);
              const bounds = viewport.getBoundingClientRect();
              const pointerX = event.clientX - bounds.left;
              const pointerY = event.clientY - bounds.top;
              const contentX = viewport.scrollLeft + pointerX;
              const contentY = viewport.scrollTop + pointerY;

              zoomButton.click();
              requestAnimationFrame(() => {
                const newScale = readScale(viewport);
                if (newScale === oldScale) return;

                const ratio = newScale / oldScale;
                viewport.scrollLeft = contentX * ratio - pointerX;
                viewport.scrollTop = contentY * ratio - pointerY;
              });
            },
            { passive: false },
          );
        }

        function bindResearchImage(card) {
          if (card.querySelector(":scope > .research-image")) return;

          const fiberProperty = Object.keys(card).find((name) =>
            name.startsWith("__reactFiber$"),
          );
          const researchId =
            card.dataset.researchId || card[fiberProperty || ""]?.key;
          const normalizedId = researchId?.toLocaleLowerCase("en");
          const spritePosition =
            window.INDOMITUS_RESEARCH_IMAGES?.[normalizedId || ""];
          if (!spritePosition) return;

          const [sheet, column, row, columns, rows] = spritePosition;
          const spriteSource = window.INDOMITUS_RESEARCH_SPRITES?.[sheet];
          if (!spriteSource) return;

          card.dataset.researchId = researchId;

          const image = document.createElement("span");
          image.className = "research-image";
          image.style.backgroundImage = `url("${spriteSource}")`;
          image.style.backgroundSize = `${columns * 86}px ${rows * 108}px`;
          image.style.backgroundPosition = `${column * -86}px ${row * -108}px`;
          image.setAttribute("aria-hidden", "true");
          card.appendChild(image);
        }

        function updatePurchaseCost() {
          const inspector = document.querySelector(".inspector");
          const selectedCard = document.querySelector(
            ".research-card.selected",
          );
          if (!inspector || !selectedCard) return;

          const researchId = selectedCard.dataset.researchId;
          const normalizedId = researchId?.toLocaleLowerCase("en");
          const purchaseCost =
            window.INDOMITUS_PURCHASE_COSTS?.[normalizedId || ""];
          let panel = inspector.querySelector(".purchase-cost-panel");

          if (purchaseCost === undefined) {
            panel?.remove();
            return;
          }

          if (!panel) {
            panel = document.createElement("section");
            panel.className = "purchase-cost-panel";
            const idRow = inspector.querySelector(".id-row");
            idRow?.insertAdjacentElement("afterend", panel);
          }

          const isEnglish = document.documentElement.lang === "en";
          const priceKey = `${normalizedId}:${purchaseCost}:${isEnglish}`;
          if (panel.dataset.priceKey === priceKey) return;
          panel.dataset.priceKey = priceKey;

          const label = document.createElement("span");
          label.textContent = isEnglish
            ? "Purchase after research"
            : "Покупка после изучения";

          const note = document.createElement("small");
          note.textContent = isEnglish
            ? "Cost of the complete squad or unit in game currency"
            : "Стоимость полного отряда или единицы в игровой валюте";
          label.appendChild(note);

          const value = document.createElement("strong");
          value.textContent = `${purchaseCost} MP`;

          panel.replaceChildren(label, value);
          panel.title = isEnglish
            ? "Calculated from the conquest unit definitions in gamelogic.pak"
            : "Рассчитано по определениям отрядов кампании из gamelogic.pak";
        }

        function scan() {
          document.querySelectorAll(".tree-viewport").forEach(bindWheelZoom);
          document.querySelectorAll(".research-card").forEach(bindResearchImage);
          updatePurchaseCost();
          updateHint();
        }

        new MutationObserver(scan).observe(document.body, {
          childList: true,
          subtree: true,
        });
        scan();
      })();
    </script>
